name: Bot Oro 15m

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install pandas numpy yfinance requests

      - name: Ejecutar script del bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py

      - name: Guardar estado (última señal enviada)
        run: |
          git config user.name "bot-oro"
          git config user.email "bot-oro@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Actualiza estado del bot [skip ci]"
          git push
